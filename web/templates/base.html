<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Veritas Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    {% set path = request.url.path if request is defined else "" %}
    <header class="top">
      <a class="brand" href="/dashboard">Veritas</a>
      <nav class="top-nav" aria-label="Dashboard">
        <a
          class="nav-link {% if path == '/dashboard' or path.startswith('/dashboard/') %}is-active{% endif %}"
          href="/dashboard"
        >Servers</a>
        <a class="nav-link" href="/" target="_blank" rel="noreferrer">Website</a>
        {% if user is defined and user %}
        <span class="user" title="Signed in">{{ user.username }}</span>
        <a class="nav-link nav-logout" href="/auth/logout">Logout</a>
        {% else %}
        <a class="btn btn-small" href="/auth/login">Login</a>
        {% endif %}
      </nav>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
