services:
  - type: web
    name: veritas
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && chmod +x scripts/start_all.sh
    startCommand: bash scripts/start_all.sh
    disk:
      name: veritas-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_ULTRA
        sync: false
      - key: PREMIUM_PRICE_LABEL
        value: "$4.99 / month"
      - key: ULTRA_PRICE_LABEL
        value: "$14.99 / month"
      - key: PAYPAL_ME_URL
        sync: false
